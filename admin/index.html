<!DOCTYPE html>
<html lang="pt-BR" class="verificando">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Cris Dall' Accua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Nada aparece antes de conferir a sessão */
html.verificando body{visibility:hidden}

:root{
  --areia:#efe9e1; --texto:#3b322b; --suave:#5f5044; --caramelo:#a9825f; --nude:#d8c3ac; --linha:#d9cfc3;
  --papel:#f7f3ee; --branco:#fffdfa;
  --verde:#4f6b45; --verde-bg:#e1e8d9; --amarelo:#8a6a1f; --amarelo-bg:#f5e6bf; --vermelho:#9a3b2b; --vermelho-bg:#f4dcd6;
  --menu:232px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--areia);color:var(--texto);font-family:"Jost",system-ui,sans-serif;font-weight:300;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- MENU LATERAL ---------- */
.menu{position:fixed;top:0;left:0;bottom:0;width:var(--menu);display:flex;flex-direction:column;background:var(--papel);border-right:1px solid var(--linha);z-index:30;transition:transform .25s}
.menu-topo{padding:22px 20px 14px}
.menu-topo strong{display:block;font-weight:400;font-size:15px}
.menu-topo span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--caramelo)}
.menu nav{flex:1;overflow-y:auto;padding:6px 12px}
.menu h2{margin:18px 8px 6px;font-size:10px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--suave);opacity:.75}
.menu nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;margin:1px 0;border-radius:6px;color:var(--suave);text-decoration:none;font-weight:400}
.menu nav a:hover{background:rgba(169,130,95,.08);color:var(--texto)}
.menu nav a.ativo{background:rgba(169,130,95,.16);color:var(--texto)}
.menu nav a.ativo svg{color:var(--caramelo)}
.menu-pe{padding:14px 20px 18px;border-top:1px solid var(--linha);font-size:12px;color:var(--suave)}
.menu-pe .email{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}
.sair{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--linha);border-radius:4px;background:transparent;cursor:pointer;font-size:12px}
.sair:hover{border-color:var(--caramelo);color:var(--caramelo)}
.veu{position:fixed;inset:0;background:rgba(59,50,43,.35);z-index:25}

/* ---------- CONTEÚDO ---------- */
.conteudo{margin-left:var(--menu);min-height:100vh;padding:22px 28px 60px}
.topo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.topo h1{margin:0;font-size:18px;font-weight:400}
.sanduiche{display:none;width:38px;height:38px;place-items:center;border:1px solid var(--linha);border-radius:6px;background:var(--papel);cursor:pointer}
@media (max-width:900px){
  .menu{transform:translateX(-100%)}
  .menu.aberto{transform:none;box-shadow:0 0 40px rgba(0,0,0,.15)}
  .conteudo{margin-left:0;padding:14px 14px 60px}
  .sanduiche{display:grid}
}

/* ---------- AVISOS ---------- */
.avisos{margin:0 0 16px;padding:12px 14px;border:1px solid #e8c3b9;border-radius:8px;background:var(--vermelho-bg);color:var(--vermelho);font-size:13px}
.avisos strong{font-weight:500}
.avisos ul{margin:6px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:calc(100% - 28px);padding:10px 16px;border-radius:6px;background:var(--texto);color:var(--areia);font-size:13px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.erro{background:var(--vermelho)}

/* ---------- PEÇAS ---------- */
.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.cartao h3{margin:0 0 12px;font-size:13px;font-weight:400;color:var(--suave)}
.faixa-num{display:grid;grid-template-columns:repeat(var(--n,5),1fr);background:var(--branco);border:1px solid var(--linha);border-radius:12px;margin-bottom:16px;overflow:hidden}
.faixa-num>div{padding:12px 16px;border-left:1px solid var(--linha);min-width:0}
.faixa-num>div:first-child{border-left:0}
.faixa-num span{display:block;font-size:11px;color:var(--suave)}
.faixa-num strong{display:block;font-size:18px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.faixa-num small{display:block;font-size:11px;color:var(--suave)}
@media (min-width:901px) and (max-width:1200px){.faixa-num[style*="--n:6"]{grid-template-columns:repeat(3,1fr)}.faixa-num[style*="--n:6"]>div:nth-child(4){border-left:0}.faixa-num[style*="--n:6"]>div:nth-child(n+4){border-top:1px solid var(--linha)}}
@media (max-width:900px){.faixa-num{grid-template-columns:repeat(2,1fr)}.faixa-num>div{border-left:0;border-top:1px solid var(--linha)}.faixa-num>div:nth-child(-n+2){border-top:0}.faixa-num>div:nth-child(even){border-left:1px solid var(--linha)}}
.duas{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width:1000px){.duas{grid-template-columns:1fr}}
.vazio{margin:0;padding:18px 4px;color:var(--suave);font-size:13px;text-align:center}

.barra-ferr{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.barra-ferr .esp{flex:1}
.busca{height:36px;min-width:220px;padding:0 12px;border:1px solid var(--linha);border-radius:6px;background:var(--branco)}
.busca:focus,.campo input:focus,.campo select:focus,.campo textarea:focus,select.sel:focus{outline:none;border-color:var(--caramelo);box-shadow:0 0 0 3px rgba(169,130,95,.15)}
select.sel{height:36px;padding:0 10px;border:1px solid var(--linha);border-radius:6px;background:var(--branco)}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--linha);border-radius:4px;background:var(--branco);cursor:pointer;font-size:13px;font-weight:400;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--caramelo);color:var(--caramelo)}
.btn--forte{background:var(--texto);border-color:var(--texto);color:var(--areia)}
.btn--forte:hover{background:var(--suave);border-color:var(--suave);color:var(--areia)}
.btn--perigo{color:var(--vermelho)}
.btn--perigo:hover{border-color:var(--vermelho);color:var(--vermelho)}
.icone{display:inline-grid;place-items:center;width:30px;height:30px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--suave);cursor:pointer}
.icone:hover{background:rgba(169,130,95,.12);color:var(--texto)}
.chips{display:inline-flex;border:1px solid var(--linha);border-radius:6px;overflow:hidden;background:var(--branco)}
.chips button{height:34px;padding:0 12px;border:0;border-left:1px solid var(--linha);background:transparent;cursor:pointer;font-size:13px}
.chips button:first-child{border-left:0}
.chips button.ativo{background:rgba(169,130,95,.16);color:var(--texto);font-weight:400}

.pilula{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:400;white-space:nowrap;line-height:1.6}
.p-exemplo{background:#ece4da;color:var(--suave);border:1px dashed var(--nude)}
.p-site{background:#efe3d4;color:#7a5a3e}
/* LEADS DO PORTFÓLIO */
.leads-topo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 12px}
.leads-topo h3{margin:0;font-size:15px;font-weight:400;color:var(--texto)}
.ao-vivo{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;color:var(--verde)}
.ao-vivo i{width:7px;height:7px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 0 rgba(79,107,69,.5);animation:pulsaVivo 1.8s infinite}
@keyframes pulsaVivo{70%{box-shadow:0 0 0 7px rgba(79,107,69,0)}100%{box-shadow:0 0 0 0 rgba(79,107,69,0)}}
@media (prefers-reduced-motion:reduce){.ao-vivo i{animation:none}}
.leads{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;border:1px solid #ece5dc;border-radius:10px;background:#fffdfa}
.lead.novo{border-color:var(--caramelo);background:#fbf5ee}
.lead-nome{font-size:14px;font-weight:400}
.lead-nome .pilula{margin-left:6px;vertical-align:1px}
.lead-quando{font-size:12px;color:var(--suave);white-space:nowrap;text-align:right}
.lead-contato{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px}
.lead-contato a{color:var(--caramelo);text-decoration:none}
.lead-contato a:hover{text-decoration:underline}
.lead-msg{grid-column:1 / -1;margin:0;padding:8px 10px;border-radius:6px;background:var(--papel);font-size:13px;color:var(--suave);white-space:pre-wrap}
.lead-acoes{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.lead-acoes .btn{height:30px;padding:0 10px;font-size:12px}
.p-novo{background:var(--caramelo);color:#fff}
.menu nav a .conta-novo{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--caramelo);color:#fff;font-size:11px;line-height:20px;text-align:center}
.s-lead{background:#efe3d4;color:#7a5a3e}
.s-conversando{background:var(--amarelo-bg);color:var(--amarelo)}
.s-cliente{background:var(--verde-bg);color:var(--verde)}
.s-parada{background:#e6e2dd;color:#7d746c}
.t-conteudo{background:#e9e2f0;color:#5d4a73}
.t-publicidade{background:#dde7ee;color:#3c5a6e}
.st-0{background:#f0ebe4;color:var(--suave)} .st-1{background:#ece1d3;color:#6e5640} .st-2{background:#f3e3c8;color:#80612a}
.st-3{background:#f0d7c4;color:#87503a} .st-4{background:#e7d6e3;color:#6b4762} .st-5{background:var(--verde-bg);color:var(--verde)} .st-6{background:var(--verde);color:#fff}
.pg-pendente{background:var(--amarelo-bg);color:var(--amarelo)}
.pg-pago{background:var(--verde-bg);color:var(--verde)}
.pg-permuta{background:#e6e0f0;color:#5d4a73}
.st-nao{background:#ece7e1;color:#8a7d70;text-decoration:line-through}
.alerta-v{background:var(--vermelho-bg);color:var(--vermelho)}
.alerta-a{background:var(--amarelo-bg);color:var(--amarelo)}

/* ---------- TABELAS ---------- */
.tabela-caixa{overflow-x:auto;background:var(--branco);border:1px solid var(--linha);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--papel);text-align:left;font-weight:400;font-size:11px;letter-spacing:.06em;color:var(--suave);padding:9px 10px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #ece5dc;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clicavel{cursor:pointer}
tbody tr.clicavel:hover td{background:#faf6f1}
td.num,th.num{text-align:right}
td.acoes{white-space:nowrap;text-align:right}
td .sub{display:block;font-size:11px;color:var(--suave)}
.corta{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th.ordena{cursor:pointer;user-select:none}
th.ordena:hover{color:var(--texto)}
th .seta{display:inline-block;width:12px;margin-left:3px;opacity:.3}
th.ativa{color:var(--texto)}
th.ativa .seta{opacity:1;color:var(--caramelo)}
tr.favorita td:first-child{box-shadow:inset 3px 0 0 var(--caramelo)}
.estrela{color:#c9b9a6}
.estrela.on{color:var(--caramelo)}
.sel-barra{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 10px;padding:8px 12px;border:1px solid var(--linha);border-radius:10px;background:var(--papel);font-size:13px;min-height:44px}
.sel-barra .esp{flex:1}
.sel-num b{font-weight:500;color:var(--caramelo)}
.link-btn{padding:0;border:0;background:none;color:var(--suave);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.link-btn:hover{color:var(--caramelo)}
th.sel-cel,td.sel-cel{width:36px;padding-right:0}
.caixinha{display:grid;place-items:center;width:28px;height:28px;cursor:pointer}
.caixinha input{width:16px;height:16px;accent-color:var(--caramelo);cursor:pointer}
.caixinha input:disabled{cursor:not-allowed;opacity:.35}
tr.selecionada td{background:rgba(169,130,95,.07)}
.so-leitor{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.btn.ativo-fav{border-color:var(--caramelo);background:rgba(169,130,95,.16);color:var(--texto)}
.btn.ativo-fav .ic{color:var(--caramelo)}
tr.grupo td{background:var(--papel);font-size:12px;color:var(--suave);font-weight:400;padding:7px 10px}
tr.grupo b{font-weight:500;color:var(--texto)}
tr.escondido td{opacity:.5}
tr.arrastando td{background:#f3ebe0}
.alca{cursor:grab;touch-action:none;color:#b9a891}
.alca:active{cursor:grabbing}

/* ---------- GRÁFICO ---------- */
.grafico{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:18px}
.grafico .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.grafico .bar{width:100%;max-width:26px;background:var(--nude);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.grafico .col.hoje .bar{background:var(--caramelo)}
.grafico .bar i{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--suave)}
.grafico .dia{margin-top:6px;font-size:10px;color:var(--suave);white-space:nowrap}
.origens{list-style:none;margin:0;padding:0}
.origens li{margin:0 0 10px}
.origens .linha{display:flex;justify-content:space-between;font-size:13px}
.origens .trilho{height:6px;margin-top:4px;border-radius:999px;background:#efe7dd;overflow:hidden}
.origens .trilho b{display:block;height:100%;background:var(--caramelo);border-radius:999px}

/* ---------- CALENDÁRIO ---------- */
.cal-mes{min-width:150px;font-size:15px;font-weight:400;text-align:center}
.cal{background:var(--branco);border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.cal-cab,.cal-grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-cab div{padding:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave);background:var(--papel);border-bottom:1px solid var(--linha)}
.cal-dia{position:relative;min-height:112px;padding:6px 6px 8px;border-right:1px solid #ece5dc;border-bottom:1px solid #ece5dc;cursor:pointer}
.cal-dia:nth-child(7n){border-right:0}
.cal-dia:hover{background:#fbf8f4}
.cal-dia.fora{background:#f8f5f1}
.cal-dia.fora .cal-n,.cal-dia.fora .cal-item{opacity:.45}
.cal-n{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 4px;border-radius:999px;font-size:12px}
.cal-dia.hoje .cal-n{background:var(--caramelo);color:#fff;font-weight:500}
.cal-dia.hoje{background:#fbf6ef}
.cal-mais-btn{position:absolute;top:5px;right:5px;width:24px;height:24px;border:0;border-radius:6px;background:rgba(169,130,95,.15);color:var(--texto);font-size:16px;line-height:1;cursor:pointer;opacity:0;transition:opacity .15s}
.cal-dia:hover .cal-mais-btn,.cal-mais-btn:focus{opacity:1}
.cal-item{display:block;width:100%;margin-top:3px;padding:2px 6px;border:0;border-radius:4px;text-align:left;font-size:11.5px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border-left:3px solid}
.ti-gravar{background:#f3e3d6;border-color:#b5704f}
.ti-editar{background:#e9e2f0;border-color:#7d62a0}
.ti-postar{background:#dde9dc;border-color:#5d8456}
.ti-prazo{background:#f7ecd9;border-color:var(--caramelo)}
.cal-item.feito{text-decoration:line-through;opacity:.55}
.cal-ver{display:block;margin-top:3px;padding:0 4px;border:0;background:none;font-size:11px;color:var(--caramelo);cursor:pointer;font-weight:400}
.legenda{display:flex;flex-wrap:wrap;gap:12px;margin:10px 2px 0;font-size:11px;color:var(--suave)}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:2px;border-left:3px solid}
@media (max-width:700px){
  .cal-dia{min-height:74px;padding:3px}
  .cal-item{font-size:10px;padding:1px 3px;border-left-width:2px}
  .cal-cab div{padding:6px 3px;font-size:9px;text-align:center}
  .cal-mais-btn{display:none}
}
.atraso{list-style:none;margin:0;padding:0}
.atraso li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #ece5dc}
.atraso li:last-child{border-bottom:0}
.atraso .txt{flex:1;min-width:0}
.atraso .txt span{display:block;font-size:11px;color:var(--suave)}

/* ---------- CHECKLIST ---------- */
.sub-abas{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;border-bottom:1px solid var(--linha)}
.sub-abas button{flex-shrink:0;padding:9px 12px;border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;font-size:13px;color:var(--suave);margin-bottom:-1px}
.sub-abas button.ativo{color:var(--texto);border-bottom-color:var(--caramelo);font-weight:400}
.progresso{height:6px;border-radius:999px;background:#efe7dd;overflow:hidden}
.progresso b{display:block;height:100%;background:var(--caramelo);border-radius:999px;transition:width .3s}
.geral{display:flex;align-items:center;gap:14px}
.geral .progresso{flex:1}
.geral strong{font-weight:400;font-size:13px;white-space:nowrap}
details.bloco{background:var(--branco);border:1px solid var(--linha);border-radius:12px;margin-bottom:10px;overflow:hidden}
details.bloco>summary{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;list-style:none}
details.bloco>summary::-webkit-details-marker{display:none}
details.bloco>summary .tit{flex:1;min-width:0}
details.bloco>summary .tit b{display:block;font-weight:400;font-size:14px}
details.bloco>summary .tit span{display:block;font-size:12px;color:var(--suave)}
details.bloco>summary .mini{width:90px}
details.bloco>summary .cont{font-size:11px;color:var(--suave);width:38px;text-align:right}
details.bloco>summary .seta-d{transition:transform .2s;color:var(--suave)}
details.bloco[open]>summary .seta-d{transform:rotate(180deg)}
.bloco-corpo{padding:0 16px 14px}
.porque{margin:0 0 12px;padding:10px 12px;border-radius:6px;background:var(--papel);font-size:13px;color:var(--suave)}
.porque b{font-weight:500;color:var(--texto)}
.item{display:flex;gap:10px;padding:9px 0;border-top:1px solid #f0e9e0;cursor:pointer}
.item input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--caramelo);flex-shrink:0;cursor:pointer}
.item b{display:block;font-weight:400}
.item span{display:block;font-size:12px;color:var(--suave)}
.item.ok b{text-decoration:line-through;color:var(--suave)}
.grade-ref{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.ref{position:relative;display:block;padding:0;border:0;border-radius:12px;overflow:hidden;aspect-ratio:9/16;cursor:pointer;text-align:left;background:var(--nude)}
.ref img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ref .emo{position:absolute;top:10px;left:10px;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(255,253,250,.9);font-size:17px}
.ref .info{position:absolute;left:0;right:0;bottom:0;padding:40px 12px 12px;background:linear-gradient(transparent,rgba(30,24,20,.82));color:#fff}
.ref .info b{display:block;font-weight:400;font-size:14px;line-height:1.3}
.ref .info span{display:block;font-size:11px;opacity:.85;margin-top:3px}
.ficha h4{margin:16px 0 4px;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--caramelo)}
.ficha p{margin:0}

<script>
/* =====================================================================
   1. ANTES DE TUDO: CONFERE A SESSÃO
   Sem sessão, vai para o login. A página só aparece depois disso.
   ===================================================================== */
const sb = window.sb;
const LOGIN = "../login/";
let minhaSessao = null;

(async function confereSessao() {
  if (!sb) {
    document.documentElement.classList.remove("verificando");
    document.body.innerHTML = '<p style="padding:40px;font-family:Jost,sans-serif">Não consegui carregar o sistema do painel. Confira a internet e recarregue a página.</p>';
    return;
  }
  let sessao = null;
  try { const r = await sb.auth.getSession(); sessao = r.data && r.data.session; } catch (e) {}
  if (!sessao) { location.replace(LOGIN); return; }
  const email = String(sessao.user && sessao.user.email || "").toLowerCase();
  if (window.BANCO.emailDaCris && email !== window.BANCO.emailDaCris.toLowerCase()) {
    await sb.auth.signOut(); location.replace(LOGIN); return;
  }
  minhaSessao = sessao;
  sb.auth.onAuthStateChange((evento, s) => { if (evento === "SIGNED_OUT" || !s) location.replace(LOGIN); });
  document.documentElement.classList.remove("verificando");
  iniciaPainel();
})();

/* =====================================================================
   2. FERRAMENTAS
   ===================================================================== */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const isoLocal = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hojeISO = () => isoLocal(new Date());
const dataDeISO = (s) => { const [a, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(a, (m || 1) - 1, d || 1); };
const diasAte = (iso) => Math.round((dataDeISO(iso) - dataDeISO(hojeISO())) / 86400000);
const dataCurta = (iso) => iso ? dataDeISO(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) : "";
const dataLonga = (iso) => iso ? dataDeISO(iso).toLocaleDateString("pt-BR") : "";
const reais = (v) => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const divide = (a, b) => (Number(b) > 0 ? (Number(a) || 0) / Number(b) : 0);
const numero = (v) => (Number(v) || 0).toLocaleString("pt-BR");
const sem = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const dias = (n) => n === 1 ? "1 dia" : `${n} dias`;

function toast(texto, erro) {
  const t = $("#toast");
  t.textContent = texto; t.className = "toast" + (erro ? " erro" : ""); t.hidden = false;
  clearTimeout(toast.tm); toast.tm = setTimeout(() => (t.hidden = true), erro ? 6000 : 2600);
}

const ICONE = {
  olho: '<svg class="ic" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  olhoFechado: '<svg class="ic" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7c1.9 0 3.5-.5 4.9-1.3M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  lapis: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>',
  lixo: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  alca: '<svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg>',
  mais: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  baixar: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  envelope: '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>',

/* =====================================================================
   3. LEITURA DO BANCO, SEM NUNCA DEIXAR A PÁGINA EM BRANCO
   Se faltar uma tabela ou um campo, o painel avisa lá em cima e segue.
   ===================================================================== */
const CAMPOS = {
  videos: ["titulo", "link", "nicho", "formato", "marca", "destaque", "ordem", "visivel"],
  marcas: ["nome", "instagram", "email", "telefone", "situacao", "obs", "ultimo_contato", "nicho", "favorita", "selecionada"],
  calendario: ["titulo", "marca", "tipo", "data", "status"],
  campanhas: ["campanha", "cliente", "tipo", "status", "qtd", "valor", "prazo", "pagamento", "ativa", "favorita", "fechada_em", "canal"],
  marcados: ["chave"],
  visitas: ["data", "pagina", "origem"],
  email_envios: ["email", "assunto", "status", "erro", "resend_id"],
  email_optout: ["email"]
};
const NOME_TABELA = { videos: "vídeos", marcas: "marcas", calendario: "calendário", campanhas: "campanhas", marcados: "marcados (checklist)", visitas: "visitas", email_envios: "registro de envios (disparo.sql)", email_optout: "descadastro (disparo.sql)" };
const dados = { videos: [], marcas: [], calendario: [], campanhas: [], marcados: new Map(), visitas: [], email_envios: [], email_optout: [] };
const funciona = { videos: true, marcas: true, calendario: true, campanhas: true, marcados: true, visitas: true, email_envios: true, email_optout: true };
const avisos = new Map();

function avisa(chave, texto) { avisos.set(chave, texto); mostraAvisos(); }
function mostraAvisos() {
  const caixa = $("#avisos");
  if (!avisos.size) { caixa.hidden = true; return; }
  caixa.innerHTML = `<strong>O painel abriu, mas faltou uma parte no banco.</strong> O resto funciona normal.<ul>${[...avisos.values()].map(t => `<li>${esc(t)}</li>`).join("")}</ul>Para resolver, rode no SQL Editor do Supabase o arquivo banco.sql (ou o disparo.sql, quando for da Prospecção).`;
  caixa.hidden = false;
}

/* Traduz os erros do banco para português */
function explica(erro, tabela) {
  const msg = String(erro && erro.message || "");
  const cod = String(erro && erro.code || "");
  const nome = NOME_TABELA[tabela] || tabela;
  const campo = (msg.match(/column ["']?([\w.]+)["']?/i) || msg.match(/the ['"](\w+)['"] column/i) || [])[1];
  if (cod === "42P01" || cod === "PGRST205" || /does not exist|could not find the table/i.test(msg) && !campo) return `A tabela "${nome}" não existe no banco.`;
  if (cod === "42703" || cod === "PGRST204" || campo) return `Falta o campo "${String(campo || "").split(".").pop()}" na tabela "${nome}".`;
  if (cod === "42501" || /permission|row-level security/i.test(msg)) return `O banco não deixou mexer em "${nome}". Confira se você entrou com o e-mail certo.`;
  if (cod === "23514") return `Um valor não é aceito na tabela "${nome}". Confira as opções escolhidas.`;
  if (cod === "23502") return `Falta preencher um campo obrigatório em "${nome}".`;
  if (/fetch|network|failed/i.test(msg)) return "Sem conexão com o banco. Confira a internet.";
  return `Não deu certo em "${nome}". Tente de novo em instantes.`;
}

async function carrega(tabela, ajusta) {
  try {
    let q = sb.from(tabela).select("*");
    if (ajusta) q = ajusta(q);
    const { data, error } = await q;
    if (error) throw error;
    funciona[tabela] = true;
    avisos.delete("t:" + tabela);
    const linhas = Array.isArray(data) ? data : [];
    if (linhas.length) {
      const faltam = CAMPOS[tabela].filter(c => !(c in linhas[0]));
      faltam.forEach(c => avisa(`c:${tabela}:${c}`, `Falta o campo "${c}" na tabela "${NOME_TABELA[tabela]}". O que depende dele fica vazio.`));
    }
    mostraAvisos();
    return linhas;
  } catch (erro) {
    funciona[tabela] = false;
    avisa("t:" + tabela, explica(erro, tabela));
    return [];
  }
}

async function carregaTudo() {
  const desde = new Date(); desde.setHours(0, 0, 0, 0); desde.setDate(desde.getDate() - 13);
  const [v, m, c, k, mk, vi, ev, oo] = await Promise.all([
    carrega("videos", q => q.order("ordem", { ascending: true })),
    carrega("marcas", q => q.order("criado_em", { ascending: false })),
    carrega("calendario", q => q.order("data", { ascending: true })),
    carrega("campanhas", q => q.order("criado_em", { ascending: false })),
    carrega("marcados"),
    carrega("visitas", q => q.gte("data", desde.toISOString()).order("data", { ascending: true }).limit(10000)),
    carrega("email_envios", q => q.order("criado_em", { ascending: false }).limit(5000)),
    carrega("email_optout")
  ]);
  dados.email_envios = ev; dados.email_optout = oo;
  dados.videos = v; dados.marcas = m; dados.calendario = c; dados.campanhas = k; dados.visitas = vi;
  dados.marcados = new Map(mk.filter(r => r.marcado !== false).map(r => [r.chave, true]));
}

/* Salvar, apagar e trocar um campo. Depois recarrega só aquela tabela. */
async function salva(tabela, id, valores) {
  const pedido = id ? sb.from(tabela).update(valores).eq("id", id) : sb.from(tabela).insert(valores);
  const { error } = await pedido;
  if (error) { toast(explica(error, tabela), true); return false; }
  await recarrega(tabela);
  return true;
}
async function apaga(tabela, id, pergunta) {
  if (!confirm(pergunta || "Apagar? Isso não dá para desfazer.")) return false;
  const { error } = await sb.from(tabela).delete().eq("id", id);
  if (error) { toast(explica(error, tabela), true); return false; }
  toast("Apagado.");
  await recarrega(tabela);
  return true;
}
async function recarrega(tabela) {
  if (tabela === "videos") dados.videos = await carrega("videos", q => q.order("ordem", { ascending: true }));
  if (tabela === "marcas") dados.marcas = await carrega("marcas", q => q.order("criado_em", { ascending: false }));
  if (tabela === "calendario") dados.calendario = await carrega("calendario", q => q.order("data", { ascending: true }));
  if (tabela === "campanhas") dados.campanhas = await carrega("campanhas", q => q.order("criado_em", { ascending: false }));
  if (tabela === "email_envios") dados.email_envios = await carrega("email_envios", q => q.order("criado_em", { ascending: false }).limit(5000));
  if (tabela === "email_optout") dados.email_optout = await carrega("email_optout");
  desenhaAba(abaAtual);
}

/* campos: [{ nome, rotulo, tipo, opcoes, valor, obrigatorio, cheio, dica }] */
function abreFormulario({ titulo, campos, aoSalvar, aoApagar }) {
  const html = campos.map(c => {
    const id = "f-" + c.nome, req = c.obrigatorio ? " required" : "", v = c.valor == null ? "" : c.valor;
    let entrada;
    if (c.tipo === "checkbox") return `<div class="campo marca-check ${c.cheio ? "cheio" : ""}"><input type="checkbox" id="${id}" name="${c.nome}"${c.valor ? " checked" : ""}><label for="${id}">${esc(c.rotulo)}</label></div>`;
    if (c.tipo === "select") entrada = `<select id="${id}" name="${c.nome}"${req}>${c.opcoes.map(o => { const [val, txt] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}"${String(val) === String(v) ? " selected" : ""}>${esc(txt)}</option>`; }).join("")}</select>`;
    else if (c.tipo === "textarea") entrada = `<textarea id="${id}" name="${c.nome}"${req}>${esc(v)}</textarea>`;
    else entrada = `<input id="${id}" name="${c.nome}" type="${c.tipo || "text"}" value="${esc(v)}"${c.tipo === "number" ? ' step="any" min="0"' : ""}${c.lista ? ` list="${id}-lista" autocomplete="off"` : ""}${req}>${c.lista ? `<datalist id="${id}-lista">${c.lista.map(o => `<option value="${esc(o)}">`).join("")}</datalist>` : ""}`;
    return `<div class="campo ${c.cheio ? "cheio" : ""}"><label for="${id}">${esc(c.rotulo)}${c.obrigatorio ? " *" : ""}</label>${entrada}${c.dica ? `<span class="dica">${esc(c.dica)}</span>` : ""}</div>`;
  }).join("");
  abreJanela(titulo, `<form id="form-jan" class="campos" novalidate>${html}</form>`,
    `${aoApagar ? `<button class="btn btn--perigo" type="button" id="jan-apagar">${ICONE.lixo}Apagar</button>` : ""}<span class="esp"></span><button class="btn" type="button" data-cancela>Cancelar</button><button class="btn btn--forte" type="button" id="jan-salvar">Salvar</button>`);
  const form = $("#form-jan");
  $("[data-cancela]", janela).addEventListener("click", () => janela.close());
  const envia = async () => {
    const faltando = campos.find(c => c.obrigatorio && !String(form.elements[c.nome].value).trim());
    if (faltando) { form.elements[faltando.nome].focus(); toast(`Preencha: ${faltando.rotulo}`, true); return; }
    const valores = {};
    campos.forEach(c => {
      const el = form.elements[c.nome];
      if (c.tipo === "checkbox") valores[c.nome] = el.checked;
      else if (c.tipo === "number") valores[c.nome] = el.value === "" ? 0 : Number(String(el.value).replace(",", "."));
      else { const t = String(el.value).trim(); valores[c.nome] = t === "" ? null : t; }
    });
    const b = $("#jan-salvar"); b.disabled = true;
    const ok = await aoSalvar(valores);
    b.disabled = false;
    if (ok !== false) { janela.close(); toast("Salvo."); }
  };
  $("#jan-salvar").addEventListener("click", envia);
  form.addEventListener("submit", (e) => { e.preventDefault(); envia(); });
  form.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); envia(); } });
  if (aoApagar) $("#jan-apagar").addEventListener("click", async () => { if (await aoApagar()) janela.close(); });
  const primeiro = form.querySelector("input,select,textarea"); if (primeiro) primeiro.focus();
}

function baixaCSV(nomeArquivo, colunas, linhas) {
  const cel = (v) => { const t = String(v == null ? "" : v); return /[;"\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const texto = [colunas.map(c => cel(c[0])).join(";"), ...linhas.map(l => colunas.map(c => cel(c[1](l))).join(";"))].join("\r\n");
  const blob = new Blob(["﻿" + texto], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nomeArquivo;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

const NICHOS_SITE = ["Beleza", "Moda", "Casal", "Fitness", "Casa e decoração", "Culinária", "Experiências", "Tech, apps e educação"];
const VIDEOS_POR_NICHO_NO_SITE = 8;
const FORMATOS = ["", "Vídeo UGC", "Criativo para anúncio", "Publi no perfil", "Unboxing", "Review"];
const ehYoutube = (l) => /(?:shorts\/|embed\/|youtu\.be\/|[?&]v=)[\w-]{11}/.test(String(l || ""));

const DESENHA = {};

/* ---------- LEADS DO PORTFÓLIO ----------
   São as marcas que chegaram pelo formulário de contato ou pelo popup do site
   (tabela marcas, origem "site" ou "popup"). Ficam na aba Portfólio, não em Marcas.
   A lista se atualiza sozinha a cada 20 segundos. */
const ORIGENS_LEAD = ["site", "popup"];
const ehLead = (r) => ORIGENS_LEAD.includes(r.origem);
const leadsDoSite = () => dados.marcas.filter(ehLead).sort((a, b) => String(b.criado_em || "").localeCompare(String(a.criado_em || "")));
const leVistoAte = () => { try { return localStorage.getItem("leads-vistos-ate") || ""; } catch (e) { return ""; } };
const gravaVistoAte = (t) => { try { localStorage.setItem("leads-vistos-ate", t); } catch (e) {} };
function leadsNovos() { const ate = leVistoAte(); return leadsDoSite().filter(r => r.criado_em && (!ate || r.criado_em > ate)); }
function contatoDoLead(r) {
  const obs = String(r.obs || "");
  const nome = (obs.match(/Contato:\s*([^\n]+)/) || [])[1] || "";
  const msg = (obs.match(/Mensagem:\s*([\s\S]+)/) || [])[1] || "";
  return { pessoa: nome.trim(), mensagem: msg.trim() };
}
function haQuanto(iso) {
  const d = new Date(iso); if (isNaN(d)) return "";
  const min = Math.round((Date.now() - d) / 60000);
  if (min < 1) return "agora";
  if (min < 60) return `há ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `há ${h} h`;
  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}
function marcaNovosNoMenu() {
  const n = leadsNovos().length;
  const a = document.querySelector('.menu nav a[data-aba="portfolio"]'); if (!a) return;
  let b = a.querySelector(".conta-novo");
  if (!n) { if (b) b.remove(); document.title = document.title.replace(/^\(\d+\)\s*/, ""); return; }
  if (!b) { b = document.createElement("span"); b.className = "conta-novo"; a.appendChild(b); }
  b.textContent = n; b.title = n === 1 ? "1 lead novo" : n + " leads novos";
  document.title = "(" + n + ") " + document.title.replace(/^\(\d+\)\s*/, "");
}
function blocoLeads() {
  if (!funciona.marcas) return `<div class="cartao"><h3>Leads do portfólio</h3><p class="vazio">Não consegui ler a tabela de marcas. Veja o aviso lá em cima.</p></div>`;
  const lista = leadsDoSite(), ate = leVistoAte();
  const itens = lista.slice(0, 30).map(r => {
    const c = contatoDoLead(r), novo = r.criado_em && (!ate || r.criado_em > ate);
    const w = linkWhats(r.telefone);
    return `<li class="lead${novo ? " novo" : ""}" data-lead="${esc(r.id)}">
      <div class="lead-nome">${esc(r.nome)}${novo ? '<span class="pilula p-novo">novo</span>' : ""}<span class="pilula p-site">${r.origem === "popup" ? "popup" : "formulário"}</span></div>
      <div class="lead-quando" title="${esc(new Date(r.criado_em).toLocaleString("pt-BR"))}">${esc(haQuanto(r.criado_em))}</div>
      <div class="lead-contato">${c.pessoa && c.pessoa !== r.nome ? `<span>${esc(c.pessoa)}</span>` : ""}${r.email ? `<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : ""}${w ? `<a href="${w}" target="_blank" rel="noopener">WhatsApp ${esc(r.telefone)}</a>` : ""}</div>
      ${c.mensagem ? `<p class="lead-msg">${esc(c.mensagem)}</p>` : ""}
      <div class="lead-acoes"><button class="btn" type="button" data-lead-mover>Levar para Marcas</button><button class="btn btn--perigo" type="button" data-lead-apaga>${ICONE.lixo}Apagar</button></div>
    </li>`;
  }).join("");
  return `<div class="cartao">
    <div class="leads-topo"><h3>Leads do portfólio</h3><span class="ao-vivo" title="A lista se atualiza sozinha a cada 20 segundos"><i></i>ao vivo</span><span class="esp" style="flex:1"></span><span style="font-size:12px;color:var(--suave)">${numero(lista.length)} no total</span></div>
    ${lista.length ? `<ul class="leads">${itens}</ul>${lista.length > 30 ? `<p class="vazio">Mostrando os 30 mais recentes.</p>` : ""}` : `<p class="vazio">Quando alguém preencher o formulário de contato ou o popup do site, o contato aparece aqui na hora.</p>`}
  </div>`;
}
async function moverLead(r) {
  if (!confirm(`Levar "${r.nome}" para a aba Marcas? Ele sai desta lista e passa a ser uma marca da sua base.`)) return;
  const quando = r.criado_em ? new Date(r.criado_em).toLocaleDateString("pt-BR") : "";
  const nota = `Chegou pelo ${r.origem === "popup" ? "popup" : "formulário"} do portfólio${quando ? " em " + quando : ""}.`;
  const ok = await salva("marcas", r.id, { origem: "painel", obs: [nota, r.obs].filter(Boolean).join("\n").slice(0, 4000) });
  if (ok) toast("Foi para a aba Marcas.");
}
let vigiaLeads = null;
async function buscaLeads() {
  if (document.hidden || !funciona.marcas) return;
  const { data, error } = await sb.from("marcas").select("*").in("origem", ORIGENS_LEAD).order("criado_em", { ascending: false }).limit(300);
  if (error || !Array.isArray(data)) return;
  const antes = new Set(leadsDoSite().map(r => String(r.id)));
  const chegaram = data.filter(r => !antes.has(String(r.id)));
  const mudou = chegaram.length || data.length !== antes.size;
  dados.marcas = [...data, ...dados.marcas.filter(r => !ehLead(r))];
  if (chegaram.length) toast(chegaram.length === 1 ? `Lead novo: ${chegaram[0].nome}` : `${chegaram.length} leads novos chegaram.`);
  if (mudou && abaAtual === "portfolio" && !janela.open) desenhaAba("portfolio");
  marcaNovosNoMenu();
}

/* Arrastar pela alcinha (funciona com mouse e com o dedo) */
function ligaArrasto(tbody) {
  tbody.addEventListener("pointerdown", (e) => {
    const alca = e.target.closest(".alca"); if (!alca) return;
    e.preventDefault();
    const linha = alca.closest("tr"), grupo = linha.dataset.grupo;
    const antes = $$(`tr[data-grupo="${grupo}"]`, tbody).map(r => r.dataset.id).join(",");
    linha.classList.add("arrastando");
    alca.setPointerCapture(e.pointerId);
    const move = (ev) => {
      const outras = $$(`tr[data-grupo="${grupo}"]`, tbody).filter(r => r !== linha);
      if (!outras.length) return;
      const alvo = outras.find(r => { const b = r.getBoundingClientRect(); return ev.clientY < b.top + b.height / 2; });
      if (alvo) { if (alvo.previousElementSibling !== linha) tbody.insertBefore(linha, alvo); }
      else { const ultima = outras[outras.length - 1]; if (ultima.nextElementSibling !== linha) ultima.after(linha); }
    };
    const solta = async () => {
      alca.removeEventListener("pointermove", move);
      alca.removeEventListener("pointerup", solta);
      alca.removeEventListener("pointercancel", solta);
      linha.classList.remove("arrastando");
      const ids = $$(`tr[data-grupo="${grupo}"]`, tbody).map(r => r.dataset.id);
      if (ids.join(",") === antes) return;
      const lista = ids.map(id => dados.videos.find(v => String(v.id) === id));
      const ordens = lista.map(v => Number(v.ordem) || 0).sort((a, b) => a - b);
      /* se havia ordens repetidas, refaz a numeração para não empatar */
      const unicas = new Set(ordens).size === ordens.length ? ordens : ordens.map((o, i) => ordens[0] + i * 10);
      const mudancas = lista.map((v, i) => ({ v, nova: unicas[i] })).filter(x => Number(x.v.ordem) !== x.nova);
      const res = await Promise.all(mudancas.map(x => sb.from("videos").update({ ordem: x.nova }).eq("id", x.v.id)));
      const erro = res.find(r => r.error);
      if (erro) toast(explica(erro.error, "videos"), true); else toast("Ordem salva. O site já mostra assim.");
      await recarrega("videos");
    };
    alca.addEventListener("pointermove", move);
    alca.addEventListener("pointerup", solta);
    alca.addEventListener("pointercancel", solta);
  });
}

}

const emailValido = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e || "").trim());

async function marcaSelecao(linhas, valor) {
  const alvo = linhas.filter(r => valor ? temEmail(r) : true);
  if (!alvo.length) return;
  if (valor === false && alvo.length > 1 && !confirm(`Tirar a seleção de ${alvo.length} marcas?`)) { tabelaMarcas(); return; }
  const antes = new Map(alvo.map(r => [r.id, r.selecionada]));
  alvo.forEach(r => { r.selecionada = valor; });
  tabelaMarcas();
  const ids = alvo.map(r => r.id);
  for (let i = 0; i < ids.length; i += 200) {

    if (error) {
      alvo.forEach(r => { r.selecionada = antes.get(r.id); });

/* ---------- IMPORTAR PLANILHA DE MARCAS (prospecção) ----------
   Aceita CSV, XLSX e XLS (o Excel e o Google Planilhas salvam nesses formatos).
   Antes de gravar, mostra uma prévia: você confere qual coluna vai para qual campo,
   escolhe a situação e vê quantas são novas e quantas já estavam na base. */
const CAMPOS_IMPORT = [["nome", "Marca"], ["nicho", "Nicho"], ["instagram", "Instagram"], ["email", "E-mail"], ["telefone", "Telefone"], ["obs", "Observação"], ["juntar", "Juntar na observação"], ["ignorar", "Não importar"]];
function adivinhaCampo(cabecalho) {
  const c = sem(cabecalho).replace(/[^a-z0-9@]/g, "");
  if (!c) return "ignorar";
  if (/^(marca|nome|empresa|brand|loja|cliente|nomedamarca|razaosocial)/.test(c)) return "nome";
  if (/insta|^@|perfil|arroba|^ig$/.test(c)) return "instagram";
  if (/email|^mail/.test(c)) return "email";
  if (/telefone|whats|celular|fone|contato|^tel/.test(c)) return "telefone";
  if (/nicho|segmento|categoria|^area|ramo|setor/.test(c)) return "nicho";
  if (/^obs|observa|nota|coment|detalhe/.test(c)) return "obs";
  return "juntar";
}
function lerCSV(texto) {
  texto = texto.replace(/^﻿/, "");
  const primeira = texto.split(/\r?\n/)[0] || "";
  const sep = [";", "\t", ","].map(s => [s, primeira.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
  const linhas = []; let linha = [], cel = "", aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (aspas) {
      if (ch === '"') { if (texto[i + 1] === '"') { cel += '"'; i++; } else aspas = false; }
      else cel += ch;
    } else if (ch === '"') aspas = true;
    else if (ch === sep) { linha.push(cel); cel = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && texto[i + 1] === "\n") i++; linha.push(cel); linhas.push(linha); linha = []; cel = ""; }
    else cel += ch;
  }
  if (cel !== "" || linha.length) { linha.push(cel); linhas.push(linha); }
  return linhas;
}
let carregandoXLSX = null;
function precisaXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (!carregandoXLSX) carregandoXLSX = new Promise((ok, falha) => {
    const s = document.createElement("script");
    s.src = "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
    s.onload = ok; s.onerror = () => { carregandoXLSX = null; falha(new Error("xlsx")); };
    document.head.appendChild(s);
  });
  return carregandoXLSX;
}
async function lerPlanilha(arquivo) {
  const nome = arquivo.name.toLowerCase();
  if (/\.(csv|txt|tsv)$/.test(nome)) return lerCSV(await arquivo.text());
  if (/\.(xlsx|xls|xlsm|ods)$/.test(nome)) {
    await precisaXLSX();
    const livro = XLSX.read(await arquivo.arrayBuffer(), { type: "array" });
    const folha = livro.Sheets[livro.SheetNames[0]];
    return XLSX.utils.sheet_to_json(folha, { header: 1, raw: false, defval: "" });
  }
  throw new Error("formato");
}
async function importaPlanilha(arquivo) {
  let linhas;
  try { linhas = await lerPlanilha(arquivo); }
  catch (e) {
    toast(e.message === "formato" ? "Esse arquivo não é planilha. Use CSV, XLSX ou XLS." : e.message === "xlsx" ? "Não consegui abrir o leitor de Excel. Confira a internet ou salve a planilha como CSV." : "Não consegui ler essa planilha.", true);
    return;
  }
  linhas = linhas.map(l => l.map(c => String(c == null ? "" : c).trim())).filter(l => l.some(c => c));
  if (linhas.length < 2) { toast("A planilha está vazia ou só tem o cabeçalho.", true); return; }
  const cab = linhas[0], corpo = linhas.slice(1);
  const mapa = cab.map(adivinhaCampo);
  if (!mapa.includes("nome")) mapa[0] = "nome";
  const estado = { mapa, situacao: "lead" };

  const linhaParaMarca = (l) => {
    const m = { nome: "", nicho: "", instagram: "", email: "", telefone: "", obs: "" }, extras = [];
    estado.mapa.forEach((campo, i) => {
      const v = l[i] || ""; if (!v) return;
      if (campo === "juntar") extras.push(`${cab[i] || "Coluna " + (i + 1)}: ${v}`);
      else if (campo !== "ignorar") m[campo] = m[campo] ? m[campo] + " · " + v : v;
    });
    if (extras.length) m.obs = [m.obs, ...extras].filter(Boolean).join(" · ");
    return m;
  };
  const chave = (t) => sem(t).replace(/^@/, "").replace(/^https?:\/\/(www\.)?instagram\.com\//, "").replace(/[^a-z0-9]/g, "");
  const calcula = () => {
    const nomes = new Set(dados.marcas.map(r => chave(r.nome)).filter(Boolean));
    const instas = new Set(dados.marcas.map(r => chave(r.instagram)).filter(Boolean));
    const novas = [], repetidas = [], semNome = [], dobradas = [];
    corpo.forEach(l => {
      const m = linhaParaMarca(l);
      if (!m.nome.trim()) { semNome.push(m); return; }
      const kn = chave(m.nome), ki = chave(m.instagram);
      if (nomes.has(kn) || (ki && instas.has(ki))) { (novas.some(n => chave(n.nome) === kn || (ki && chave(n.instagram) === ki)) ? dobradas : repetidas).push(m); return; }
      nomes.add(kn); if (ki) instas.add(ki);
      novas.push(m);
    });
    return { novas, repetidas, semNome, dobradas };
  };
  const desenha = () => {
    const r = calcula();
    const amostra = r.novas.slice(0, 5);
    $("#imp-colunas").innerHTML = cab.map((c, i) => `
      <div class="campo"><label for="imp-c${i}">${esc(c || "Coluna " + (i + 1))}</label>
        <select id="imp-c${i}" data-i="${i}">${CAMPOS_IMPORT.map(o => `<option value="${o[0]}"${estado.mapa[i] === o[0] ? " selected" : ""}>${o[1]}</option>`).join("")}</select>
        <span class="dica">Ex: ${esc((corpo.find(l => l[i]) || [])[i] || "vazio")}</span></div>`).join("");
    const n = (q, um, varios) => q === 1 ? um : varios.replace("#", q);
    $("#imp-resumo").innerHTML = (r.novas.length ? `<b>${n(r.novas.length, "1 marca nova", "# marcas novas")}</b> para entrar.` : "Nenhuma marca nova.") +
      (r.repetidas.length ? " " + n(r.repetidas.length, "1 já estava na sua base e fica de fora.", "# já estavam na sua base e ficam de fora.") : "") +
      (r.dobradas.length ? " " + n(r.dobradas.length, "1 aparece repetida na planilha e entra uma vez só.", "# aparecem repetidas na planilha e entram uma vez só.") : "") +
      (r.semNome.length ? " " + n(r.semNome.length, "1 linha sem o nome da marca fica de fora.", "# linhas sem o nome da marca ficam de fora.") : "");
    $("#imp-previa").innerHTML = amostra.length ? `<div class="tabela-caixa"><table><thead><tr><th>Marca</th><th>Nicho</th><th>Instagram</th><th>E-mail</th><th>Telefone</th><th>Observação</th></tr></thead><tbody>${amostra.map(m => `<tr><td>${esc(m.nome)}</td><td>${esc(m.nicho)}</td><td>${esc(arroba(m.instagram))}</td><td class="corta">${esc(m.email)}</td><td style="white-space:nowrap">${esc(m.telefone)}</td><td class="corta" title="${esc(m.obs)}">${esc(m.obs)}</td></tr>`).join("")}</tbody></table></div>${r.novas.length > 5 ? `<p class="dica" style="margin:6px 2px 0">Mostrando 5 de ${r.novas.length}.</p>` : ""}` : `<p class="vazio">Nenhuma marca nova para importar.</p>`;
    $("#imp-salvar").disabled = !r.novas.length;
    $("#imp-salvar").textContent = r.novas.length ? (r.novas.length === 1 ? "Importar 1 marca" : `Importar ${r.novas.length} marcas`) : "Importar";
  };

  abreJanela(`Importar planilha: ${arquivo.name}`, `
    <p style="margin:0 0 12px;font-size:13px;color:var(--suave)">Confira para onde vai cada coluna. O que estiver em "Juntar na observação" entra na observação, com o nome da coluna.</p>
    <div class="campos" id="imp-colunas"></div>
    <div class="campos" style="margin-top:12px"><div class="campo"><label for="imp-sit">Situação dessas marcas</label>
      <select id="imp-sit">${SITUACOES.map(s => `<option value="${s[0]}"${s[0] === estado.situacao ? " selected" : ""}>${s[1]}</option>`).join("")}</select>
      <span class="dica">Todas entram com essa situação. Depois dá para mudar uma por uma.</span></div></div>
    <p id="imp-resumo" style="margin:16px 0 8px;font-size:13px"></p>
    <div id="imp-previa"></div>`,
    `<span class="esp"></span><button class="btn" type="button" data-cancela>Cancelar</button><button class="btn btn--forte" type="button" id="imp-salvar">Importar</button>`, true);
  $("[data-cancela]", janela).addEventListener("click", () => janela.close());
  $("#imp-colunas").addEventListener("change", (e) => { const s = e.target.closest("select[data-i]"); if (!s) return; estado.mapa[+s.dataset.i] = s.value; desenha(); });
  $("#imp-sit").addEventListener("change", (e) => { estado.situacao = e.target.value; });
  $("#imp-salvar").addEventListener("click", async () => {
    const { novas } = calcula();
    if (!novas.length) return;
    const b = $("#imp-salvar"); b.disabled = true; b.textContent = "Importando...";
    const corta = (t, n) => { t = String(t || "").trim(); return t ? t.slice(0, n) : null; };
    const registros = novas.map(m => ({ nome: corta(m.nome, 200), nicho: corta(m.nicho, 80), instagram: corta(m.instagram, 200), email: corta(m.email, 200), telefone: corta(m.telefone, 60), obs: corta(m.obs, 2000), situacao: estado.situacao, origem: "painel" }));
    let feitas = 0;
    for (let i = 0; i < registros.length; i += 200) {
      const { error } = await sb.from("marcas").insert(registros.slice(i, i + 200));
      if (error) {
        toast((feitas ? `Entraram ${feitas}, mas parou no meio. ` : "") + explica(error, "marcas"), true);
        b.disabled = false; b.textContent = "Tentar de novo";
        if (feitas) await recarrega("marcas");
        return;
      }
      feitas += Math.min(200, registros.length - i);
    }
    janela.close();
    await recarrega("marcas");
    toast(feitas === 1 ? "Pronto: 1 marca importada." : `Pronto: ${feitas} marcas importadas.`);
  });
  desenha();
}

const TIPOS_CAL = [["gravar", "Gravar"], ["editar", "Editar"], ["postar", "Postar"]];
const estadoCal = { ano: new Date().getFullYear(), mes: new Date().getMonth(), filtro: "todos" };

function itensDoCalendario() {
  const itens = [];
  if (estadoCal.filtro !== "prazos") dados.calendario.forEach(c => {
    if (!c.data) return;
    if (estadoCal.filtro !== "todos" && c.tipo !== estadoCal.filtro) return;
    itens.push({ origem: "cal", id: c.id, data: String(c.data).slice(0, 10), tipo: c.tipo || "gravar", texto: c.titulo || "", marca: c.marca, feito: c.status === "feito", reg: c });
  });
  if (estadoCal.filtro === "todos" || estadoCal.filtro === "prazos") dados.campanhas.forEach(k => {
    if (!k.prazo || finalizada(k)) return;
    itens.push({ origem: "camp", id: k.id, data: String(k.prazo).slice(0, 10), tipo: "prazo", texto: "Prazo: " + (k.campanha || ""), marca: k.cliente, feito: k.status === "Entregue", reg: k });
  });
  return itens;
}

DESENHA.calendario = function (caixa) {
  const { ano, mes } = estadoCal;
  const primeiro = new Date(ano, mes, 1);
  const recuo = (primeiro.getDay() + 6) % 7;
  const diasNoMes = new Date(ano, mes + 1, 0).getDate();
  const semanas = Math.ceil((recuo + diasNoMes) / 7);
  const inicio = new Date(ano, mes, 1 - recuo);
  const hoje = hojeISO();
  const itens = itensDoCalendario();
  const porDia = {};
  itens.forEach(i => (porDia[i.data] = porDia[i.data] || []).push(i));
  const nomeMes = primeiro.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });

  let celulas = "";
  for (let i = 0; i < semanas * 7; i++) {
    const d = new Date(inicio); d.setDate(inicio.getDate() + i);
    const iso = isoLocal(d), lista = porDia[iso] || [];
    const fora = d.getMonth() !== mes;
    celulas += `<div class="cal-dia${fora ? " fora" : ""}${iso === hoje ? " hoje" : ""}" data-dia="${iso}">
      <span class="cal-n">${d.getDate()}</span>

      ${lista.slice(0, 3).map(it => `<button type="button" class="cal-item ti-${esc(it.tipo)}${it.feito ? " feito" : ""}" data-item="${it.origem}:${esc(it.id)}" title="${esc(it.texto)}${it.marca ? " · " + esc(it.marca) : ""}">${esc(it.texto)}</button>`).join("")}
      ${lista.length > 3 ? `<button type="button" class="cal-ver" data-ver="${iso}">+${lista.length - 3} mais</button>` : ""}
    </div>`;
  }

  /* Ficou pra trás: itens não feitos com data antes de hoje, e prazos vencidos de campanhas não entregues */
  const atrasados = [
    ...dados.calendario.filter(c => c.data && String(c.data).slice(0, 10) < hoje && c.status !== "feito").map(c => ({ origem: "cal", id: c.id, data: String(c.data).slice(0, 10), tipo: c.tipo, texto: c.titulo, marca: c.marca })),
    ...dados.campanhas.filter(k => k.prazo && String(k.prazo).slice(0, 10) < hoje && k.status !== "Entregue" && !finalizada(k)).map(k => ({ origem: "camp", id: k.id, data: String(k.prazo).slice(0, 10), tipo: "prazo", texto: "Prazo: " + (k.campanha || ""), marca: k.cliente }))
  ].sort((a, b) => a.data.localeCompare(b.data));

  caixa.innerHTML = `
    <div class="barra-ferr">
      <button class="icone" type="button" id="c-ant" aria-label="Mês anterior">${ICONE.esq}</button>
      <span class="cal-mes">${esc(nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1))}</span>
      <button class="icone" type="button" id="c-prox" aria-label="Próximo mês">${ICONE.dir}</button>
      <button class="btn" type="button" id="c-hoje">Este mês</button>
      <span class="esp"></span>
      <div class="chips" id="c-filtro">${[["todos", "Todos"], ...TIPOS_CAL, ["prazos", "Prazos"]].map(([v, t]) => `<button type="button" data-f="${v}" class="${estadoCal.filtro === v ? "ativo" : ""}">${t}</button>`).join("")}</div>
      <button class="btn btn--forte" type="button" id="c-add">${ICONE.mais}Adicionar</button>
    </div>
    <div class="cal">
      <div class="cal-cab">${["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"].map(d => `<div>${d}</div>`).join("")}</div>
      <div class="cal-grade" id="c-grade">${celulas}</div>
    </div>
    <div class="legenda"><span><i class="ti-gravar"></i>Gravar</span><span><i class="ti-editar"></i>Editar</span><span><i class="ti-postar"></i>Postar</span><span><i class="ti-prazo"></i>Prazo de campanha (vem sozinho da aba Campanhas)</span></div>
    ${funciona.calendario ? "" : '<p class="vazio">Não consegui ler a tabela do calendário. Veja o aviso lá em cima.</p>'}
    <div class="cartao" style="margin-top:16px"><h3>Ficou pra trás</h3>${atrasados.length ? `<ul class="atraso">${atrasados.map(a => {
      const n = -diasAte(a.data);
      return `<li><span class="pilula alerta-v">há ${dias(n)}</span><div class="txt">${esc(a.texto)}<span>${esc(a.tipo === "prazo" ? "prazo de campanha" : nomeTipo(a.tipo))}${a.marca ? " · " + esc(a.marca) : ""} · era ${dataLonga(a.data)}</span></div>${a.origem === "cal" ? `<button class="btn" type="button" data-feito="${esc(a.id)}">${ICONE.check}Feito</button>` : `<button class="btn" type="button" data-camp="${esc(a.id)}">Abrir</button>`}</li>`;

/* FINALIZADA É AUTOMÁTICO: não fechou, ou aprovada/entregue e já paga (ou permuta).
   Entregue com pagamento pendente continua ativa, porque ainda falta receber. */
function finalizada(k) { return k.status === NAO_FECHOU || ((k.status === "Entregue" || k.status === "Aprovado") && (k.pagamento === "pago" || k.pagamento === "permuta")); }
const canaisDasCampanhas = () => [...new Set(dados.campanhas.map(k => String(k.canal || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));

  ["favorita", "", (k) => (k.favorita ? 0 : 1)],
  ["campanha", "Campanha", (k) => sem(k.campanha)],
  ["cliente", "Cliente", (k) => sem(k.cliente)],
  ["fechada_em", "Fechou em", (k) => k.fechada_em ? String(k.fechada_em).slice(0, 10) : null],

];

function avisoPrazo(k) {
  if (!k.prazo || k.status === "Entregue" || !fechou(k)) return "";
  const n = diasAte(k.prazo);
  if (n < 0) return `<span class="pilula alerta-v">atrasada ${dias(-n)}</span>`;
  if (n === 0) return `<span class="pilula alerta-a">vence hoje</span>`;
  if (n <= 3) return `<span class="pilula alerta-a">vence em ${dias(n)}</span>`;
  return "";
}

function campanhasOrdenadas() {
  const b = sem(estadoCamp.busca);
  const col = COLUNAS_CAMP.find(c => c[0] === estadoCamp.col) || COLUNAS_CAMP[3];
  const dir = estadoCamp.asc ? 1 : -1;
  return dados.campanhas
    .filter(k => estadoCamp.filtro === "todas" || (estadoCamp.filtro === "ativas" ? !finalizada(k) : finalizada(k)))
    .filter(k => !b || sem(k.campanha).includes(b) || sem(k.cliente).includes(b) || sem(k.canal).includes(b))
    .slice().sort((x, y) => {
      const a = col[2](x), c = col[2](y);
      if (a === null && c === null) return 0;
      if (a === null) return 1;   /* sem prazo vai sempre pro fim */
      if (c === null) return -1;
      if (typeof a === "string") return a.localeCompare(c, "pt-BR") * dir;
      return (a - c) * dir;
    });

/* ---------- monta o e-mail ---------- */
function linkifica(textoEscapado) {
  return textoEscapado.replace(/(@?)(\bhttps?:\/\/[^\s<]+|\bwww\.[^\s<]+|\b[a-z0-9][a-z0-9-]*(?:\.[a-z0-9-]+)*\.(?:com\.br|com|net\.br|net|org\.br|org|io|co|app|me|site|store|shop|br)(?:\/[^\s<]*)?)/gi, (u, arroba, url) => {
    if (arroba) return u; /* parte de um e-mail: deixa como está */
    u = url;
    const limpo = u.replace(/[.,;:!?)]+$/, ""), resto = u.slice(limpo.length);
    const href = /^https?:/i.test(limpo) ? limpo : "https://" + limpo;
    return `<a href="${href}" style="color:#8a6440;text-decoration:underline">${limpo}</a>${resto}`;
  });
}
function emailDoTexto(texto, botaoTexto, botaoLink) {
  const paragrafos = String(texto || "").replace(/\r/g, "").trim().split(/\n\s*\n/).filter(p => p.trim())

  let link = String(botaoLink || "").trim();
  if (link && !/^(https?:|mailto:)/i.test(link)) link = "https://" + link;
  const botao = botaoTexto && link ? `
      <p style="margin:26px 0 8px"><a href="${esc(link)}" style="display:inline-block;background:#3b322b;color:#ffffff;text-decoration:none;padding:13px 24px;border-radius:8px;font-weight:bold;font-size:15px">${esc(botaoTexto)}</a></p>` : "";
  return `<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:0;background:#ffffff">

  </div>
</body>
</html>`;
}

function textoSimples(html) {
  const d = new DOMParser().parseFromString(String(html || ""), "text/html");
  d.querySelectorAll("br").forEach(b => b.replaceWith("\n"));

  return (d.body.textContent || "").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}

function destinatarios() {
  const lista = estadoPr.lista;
  if (lista === "teste") return { envio: [{ email: MEU_EMAIL, marca: exemploMarca(), ids: [] }], semEmail: 0, repetidos: 0, descadastrados: 0, jaRecebeu: 0, base: 1 };
  let base = dados.marcas;
  if (lista === "selecionadas") base = base.filter(r => r.selecionada);
  else if (lista.startsWith("sit:")) base = base.filter(r => r.situacao === lista.slice(4));
  const semEmail = base.filter(r => !temEmail(r)).length;
  const fora = optoutSet(), ja = estadoPr.pular && estadoPr.assunto.trim() ? jaRecebeuSet(estadoPr.assunto.trim()) : new Set();
  const porEmail = new Map(); let repetidos = 0, descadastrados = 0, jaRecebeu = 0;
  base.filter(temEmail).forEach(r => {
    const e = minus(r.email);
    if (porEmail.has(e)) { repetidos++; porEmail.get(e).ids.push(r.id); return; }
    porEmail.set(e, { email: e, marca: String(r.nome || "").trim(), ids: [r.id] });
  });
  const envio = [];
  porEmail.forEach(d => {
    if (fora.has(d.email)) { descadastrados++; return; }
    if (ja.has(d.email)) { jaRecebeu++; return; }
    envio.push(d);
  });
  return { envio, semEmail, repetidos, descadastrados, jaRecebeu, base: base.length };
}
function exemploMarca() {
  const sel = dados.marcas.find(r => r.selecionada && temEmail(r)) || dados.marcas.find(temEmail);
  return sel ? String(sel.nome || "").trim() || "Natura" : "Natura";
}

  const d = destinatarios();

  if (d.descadastrados) partes.push(d.descadastrados === 1 ? "1 descadastrada" : `${d.descadastrados} descadastradas`);

  const selVazia = estadoPr.lista === "selecionadas" && !dados.marcas.some(r => r.selecionada && temEmail(r));

    ? `<div class="pr-alerta erro">O seu HTML está sem o rodapé do SAIR. Coloque uma frase dizendo que é só responder SAIR para não receber mais.</div>` : "";
  /* ações */
  const gmail = estadoPr.envio === "gmail";
  $("#pr-envio-dica").textContent = gmail
    ? "Monta a fila com uma marca por vez. Você abre no Gmail, envia e marca como enviada."
    : "Primeiro o teste para você. Depois o disparo, em lotes de 100, com confirmação antes.";
  if (!enviando) $("#pr-acoes").innerHTML = gmail
    ? `<button class="btn" type="button" id="pr-teste">${ICONE.envelope}Abrir teste pra mim no Gmail</button><button class="btn btn--forte" type="button" id="pr-fila-montar"${n && estadoPr.lista !== "teste" ? "" : " disabled"}>Montar a fila (${numero(estadoPr.lista === "teste" ? 0 : n)})</button>`
    : `<button class="btn" type="button" id="pr-teste">${ICONE.envelope}Enviar teste pra mim</button><button class="btn btn--forte" type="button" id="pr-disparar"${n && estadoPr.lista !== "teste" ? "" : " disabled"}>${ICONE.enviar}Disparar para ${numero(estadoPr.lista === "teste" ? 0 : n)}</button>`;
  const bt = $("#pr-teste"); if (bt) bt.onclick = () => gmail ? abreGmail({ email: MEU_EMAIL, marca: exemploMarca() }) : enviaTeste();
  const bd = $("#pr-disparar"); if (bd) bd.onclick = confirmaDisparo;
  const bf = $("#pr-fila-montar"); if (bf) bf.onclick = () => { filaGmail = { itens: destinatarios().envio, pos: 0, feitos: 0 }; desenhaFila(); };
  if (gmail && filaGmail) desenhaFila(); else if (!enviando && !$("#pr-andamento").dataset.fixo) $("#pr-andamento").innerHTML = "";
  /* prévia, com um pequeno atraso para não pesar enquanto digita */

  const mostra = lista.slice(0, 200);
  const quando = (t) => { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); };
  alvo.innerHTML = `<div class="tabela-caixa"><table><thead><tr><th>Para</th><th>Assunto</th><th>Quando</th><th>Situação</th></tr></thead><tbody>${

function listaOptout() {
  const ul = $("#pr-lista-optout"); if (!ul) return;
  if (!funciona.email_optout) { ul.innerHTML = `<li><span class="sub">A tabela de descadastro ainda não existe. Rode o disparo.sql.</span></li>`; return; }

  $$("[data-volta]", ul).forEach(b => b.addEventListener("click", async () => {
    if (!confirm(`Deixar ${b.dataset.volta} receber e-mails de novo?`)) return;
    const { error } = await sb.from("email_optout").delete().eq("email", b.dataset.volta);
    if (error) { toast(explica(error, "email_optout"), true); return; }
