/* ---------- envio pelo Resend ---------- */
function confereTexto() {
  if (!estadoPr.assunto.trim()) { toast("Escreva o assunto.", true); $("#pr-assunto").focus(); return false; }
  if (estadoPr.modo === "texto" && !estadoPr.texto.trim()) { toast("Escreva o texto do e-mail.", true); $("#pr-texto").focus(); return false; }
  if (estadoPr.modo === "html" && !estadoPr.html.trim()) { toast("Cole o HTML do e-mail.", true); $("#pr-html").focus(); return false; }
  if (estadoPr.botaoTexto.trim() && !estadoPr.botaoLink.trim() && estadoPr.modo === "texto") { toast("O botão precisa de um link.", true); $("#pr-btn-link").focus(); return false; }
  return true;
}
async function chamaCarteiro(lista, pular) {
  const { data } = await sb.auth.getSession();
  const token = data && data.session && data.session.access_token;
  if (!token) throw new Error("Sua sessão expirou. Entre de novo no painel.");
  let r;
  try {
    r = await fetch(`${window.BANCO.url}/functions/v1/enviar-emails`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, apikey: window.BANCO.chave },
      body: JSON.stringify({ destinatarios: lista.map(d => ({ email: d.email, marca: d.marca })), assunto: estadoPr.assunto.trim(), html: htmlAtual(), pularMesmoAssunto: pular })
    });
  } catch (e) { throw new Error("Não consegui falar com o Supabase. Confira a internet."); }
  const corpo = await r.json().catch(() => ({}));
  if (r.status === 404) throw new Error("A função enviar-emails ainda não está no Supabase. Siga o passo a passo para subir, ou use o Rascunho pelo Gmail.");
  if (!r.ok) throw new Error(corpo.erro || corpo.message || `O Supabase respondeu com erro ${r.status}.`);
  return corpo;
}
const semDominio = (res) => (res.resultados || []).some(x => /verify a domain|testing emails|own email address|domain is not verified/i.test(x.erro || ""));
async function enviaTeste() {
  if (!confereTexto()) return;
  const b = $("#pr-teste"); b.disabled = true; b.textContent = "Enviando teste...";
  let msg;
  try {
    const res = await chamaCarteiro([{ email: MEU_EMAIL, marca: exemploMarca() }], false);
    if (res.cotaAcabou) msg = `<div class="pr-alerta erro">A cota de hoje do Resend acabou. Tente o teste amanhã.</div>`;
    else if (res.enviados) msg = `<div class="pr-alerta ok">Teste enviado para ${esc(MEU_EMAIL)}. Abra no celular e confira o nome da marca no lugar certo.</div>`;
    else msg = `<div class="pr-alerta erro">O teste não saiu: ${esc((res.resultados && res.resultados[0] && res.resultados[0].erro) || "erro desconhecido")}</div>`;
  } catch (e) { msg = `<div class="pr-alerta erro">${esc(e.message)}</div>`; }
  await recarrega("email_envios");
  mostraAndamento(msg);
}
function mostraAndamento(html) { const a = $("#pr-andamento"); if (a) { a.innerHTML = html; a.dataset.fixo = "1"; } }
function confirmaDisparo() {
  if (!confereTexto()) return;
  const d = destinatarios(); const n = d.envio.length;
  if (!n) { toast("Ninguém para receber nessa lista.", true); return; }
  const semSair = estadoPr.modo === "html" && !/\bSAIR\b/i.test(estadoPr.html);
  abreJanela("Confirmar o disparo", `
    <p style="margin:0 0 10px;font-size:15px">Vai para <b>${numero(n)} ${n === 1 ? "marca" : "marcas"}</b>, da lista <b>${esc(nomeDaLista(estadoPr.lista))}</b>, e não dá para desfazer.</p>
    <p style="margin:0;color:var(--suave);font-size:13px">Assunto: ${esc(estadoPr.assunto)}</p>
    ${semSair ? `<div class="pr-alerta erro">O HTML está sem o rodapé do SAIR. O recomendado é voltar e colocar antes de disparar.</div>` : ""}`,
    `<span class="esp"></span><button class="btn" type="button" data-cancela>Cancelar</button><button class="btn btn--forte" type="button" id="pr-sim">Sim, disparar</button>`);
  $("[data-cancela]", janela).addEventListener("click", () => janela.close());
  $("#pr-sim").addEventListener("click", () => { janela.close(); dispara(d.envio); });
}
async function dispara(lista) {
  enviando = true;
  const total = lista.length, listaEra = estadoPr.lista;
  let enviados = 0, falhas = 0, pulados = 0, feitos = 0, cota = false, dominio = false, erroGeral = "";
  const okEmails = new Set();
  $("#pr-acoes").innerHTML = `<button class="btn" type="button" disabled>Enviando...</button>`;
  const pinta = () => mostraAndamento(`<div class="pr-progresso"><div class="barra"><b style="width:${Math.round(divide(feitos, total) * 100)}%"></b></div><p>${numero(feitos)} de ${numero(total)} processados. Não feche esta página.</p></div>`);
  pinta();
  for (let i = 0; i < lista.length; i += LOTE) {
    const lote = lista.slice(i, i + LOTE);
    try {
      const res = await chamaCarteiro(lote, estadoPr.pular);
      enviados += res.enviados || 0; falhas += res.falhas || 0; pulados += res.pulados || 0;
      (res.resultados || []).filter(x => x.status === "ok").forEach(x => okEmails.add(minus(x.email)));
      if (semDominio(res)) { dominio = true; feitos += lote.length; break; }
      if (res.cotaAcabou) { cota = true; feitos += lote.length - (res.faltaram || 0); break; }
    } catch (e) { erroGeral = e.message; break; }
    feitos += lote.length; pinta();
  }
  const faltaram = total - enviados - falhas - pulados;
  /* marca as marcas que receberam, com a data de hoje */
  const ids = lista.filter(d => okEmails.has(d.email)).flatMap(d => d.ids);
  for (let i = 0; i < ids.length; i += 200) await sb.from("marcas").update({ ultimo_contato: hojeISO() }).in("id", ids.slice(i, i + 200));
  enviando = false;
  await Promise.all([recarrega("email_envios"), recarrega("marcas")]);
  mostraAndamento(`
    <div class="pr-resumo"><div><strong>${numero(enviados)}</strong><span>enviados</span></div><div><strong>${numero(falhas)}</strong><span>falhas</span></div><div><strong>${numero(pulados)}</strong><span>pulados</span></div></div>
    ${cota ? `<div class="pr-alerta erro">A cota diária do Resend acabou no meio do disparo. ${numero(Math.max(faltaram, 0))} ficaram faltando. Volte amanhã, cole o mesmo assunto e o mesmo texto e deixe marcada a caixinha de pular quem já recebeu: aí ele manda só para quem faltou.</div>` : ""}
    ${dominio ? `<div class="pr-alerta erro">O Resend só está deixando mandar para você mesma, porque o seu domínio ainda não foi verificado lá. Verifique o crisdallaccua.com no Resend, ou use o Rascunho pelo Gmail por enquanto.</div>` : ""}
    ${erroGeral ? `<div class="pr-alerta erro">${esc(erroGeral)} ${feitos ? "O que já tinha saído ficou registrado no histórico." : ""}</div>` : ""}
    ${falhas && !dominio ? `<div class="pr-alerta">Os e-mails com falha ficaram no histórico, para você conferir e limpar a base.</div>` : ""}`);
  if (listaEra === "selecionadas" && enviados && dados.marcas.some(r => r.selecionada) && confirm("Disparo feito. Quer limpar a seleção da aba Marcas?\n\nSe for mandar para a mesma lista de novo, clique em Cancelar.")) {
    await marcaSelecao(dados.marcas.filter(r => r.selecionada), false);
  }
}

/* ---------- modo rascunho pelo Gmail ---------- */
function linkGmail(d) {
  return "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(d.email) + "&su=" + encodeURIComponent(trocaChaves(estadoPr.assunto, d.marca, false)) + "&body=" + encodeURIComponent(textoGmail(d.marca));
}
function abreGmail(d) { if (!confereTexto()) return; window.open(linkGmail(d), "_blank", "noopener"); }
function desenhaFila() {
  const a = $("#pr-andamento"); if (!a || !filaGmail) return;
  a.dataset.fixo = "";
  const f = filaGmail, item = f.itens[f.pos];
  if (!item) {
    a.innerHTML = `<div class="pr-alerta ok">Fila terminada: ${numero(f.feitos)} marcada${f.feitos === 1 ? "" : "s"} como enviada${f.feitos === 1 ? "" : "s"}.</div>`;
    filaGmail = null; return;
  }
  a.innerHTML = `<div class="pr-fila">
    <div class="pr-fila-cab"><span>${numero(f.pos + 1)} de ${numero(f.itens.length)}</span><span>${numero(f.feitos)} enviada${f.feitos === 1 ? "" : "s"}</span></div>
    <div class="pr-fila-corpo">
      <h4>${esc(item.marca)}</h4><p class="para">${esc(item.email)}</p>
      <p style="margin:0 0 6px;font-size:13px"><b style="font-weight:500">${esc(trocaChaves(estadoPr.assunto, item.marca, false))}</b></p>
      <pre>${esc(textoGmail(item.marca))}</pre>
      <div class="pr-acoes">
        <button class="btn" type="button" id="fl-copiar">${ICONE.copiar}Copiar o texto</button>
        <button class="btn" type="button" id="fl-gmail">${ICONE.envelope}Abrir no Gmail</button>
        <button class="btn btn--forte" type="button" id="fl-feito">Marquei como enviada</button>
        <button class="link-btn" type="button" id="fl-pula">pular esta</button>
      </div>
    </div></div>`;
  $("#fl-copiar").onclick = async () => {
    const txt = textoGmail(item.marca), html = trocaChaves(htmlAtual(), item.marca, true);
    try {
      if (window.ClipboardItem) await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([txt], { type: "text/plain" }) })]);
      else await navigator.clipboard.writeText(txt);
      toast("Texto copiado.");
    } catch (e) { try { await navigator.clipboard.writeText(txt); toast("Texto copiado."); } catch (x) { toast("Não consegui copiar. Selecione o texto e copie.", true); } }
  };
  $("#fl-gmail").onclick = () => abreGmail(item);
  $("#fl-pula").onclick = () => { f.pos++; desenhaFila(); };
  $("#fl-feito").onclick = async () => {
    const b = $("#fl-feito"); b.disabled = true;
    if (funciona.email_envios) {
      const { error } = await sb.from("email_envios").insert({ email: item.email, marca: item.marca, assunto: estadoPr.assunto.trim(), status: "ok", via: "gmail" });
      if (error) { toast(explica(error, "email_envios"), true); b.disabled = false; return; }
    }
    await sb.from("marcas").update({ ultimo_contato: hojeISO() }).in("id", item.ids);
    f.feitos++; f.pos++;
    await Promise.all([recarrega("email_envios"), recarrega("marcas")]);
  };
}

/* =====================================================================
   10. ABA CHECKLIST (conteúdo de js/biblioteca.js, usado sem alterar)
   ===================================================================== */
const B = window.Biblioteca || null;
const SUBABAS = [["checklist", "Checklist do portfólio"], ["referencias", "Referências de vídeo"], ["roteiros", "Roteiros"], ["nichos", "Ideias por nicho"], ["revisar", "Revisar meu roteiro"]];
let subAba = "checklist";
const CORES_REF = { coral: "#e8b4a0", rosa: "#e9c4c4", mostarda: "#e3c77f", terra: "#c9a27e", oliva: "#b8be94", areia: "#e2d5c3" };
const idShort = (l) => (String(l || "").match(/(?:shorts\/|embed\/|youtu\.be\/|[?&]v=)([\w-]{11})/) || [])[1] || "";
const lista = (x) => Array.isArray(x) ? x : [];

async function marca(chave, ligado) {
  if (ligado) dados.marcados.set(chave, true); else dados.marcados.delete(chave);
  if (!funciona.marcados) { toast("Não ficou salvo: a tabela marcados não está no banco.", true); return; }
  const { error } = ligado
    ? await sb.from("marcados").upsert({ chave, marcado: true, atualizado_em: new Date().toISOString() })
    : await sb.from("marcados").delete().eq("chave", chave);
  if (error) toast(explica(error, "marcados"), true);
}

DESENHA.checklist = function (caixa) {
  if (!B) { caixa.innerHTML = '<div class="cartao"><p class="vazio">Não encontrei o arquivo js/biblioteca.js. Ele precisa estar publicado junto com o site para esta aba funcionar.</p></div>'; return; }
  caixa.innerHTML = `<div class="sub-abas" role="tablist">${SUBABAS.map(([v, t]) => `<button type="button" role="tab" data-sub="${v}" class="${subAba === v ? "ativo" : ""}">${t}</button>`).join("")}</div><div id="sub-corpo"></div>`;
  $(".sub-abas", caixa).addEventListener("click", (e) => { const b = e.target.closest("[data-sub]"); if (b) { subAba = b.dataset.sub; DESENHA.checklist(caixa); } });
  const corpo = $("#sub-corpo");
  try { SUB[subAba](corpo); }
  catch (erro) { console.error(erro); corpo.innerHTML = '<div class="cartao"><p class="vazio">Esta parte não conseguiu abrir agora. As outras continuam funcionando.</p></div>'; }
};
const SUB = {};

SUB.checklist = function (corpo) {
  const secoes = lista(B.CHECKLIST);
  const conta = (s) => lista(s.itens).filter((_, i) => dados.marcados.has(`check:${s.id}:${i}`)).length;
  const totalItens = secoes.reduce((t, s) => t + lista(s.itens).length, 0);
  const desenha = () => {
    const feitos = secoes.reduce((t, s) => t + conta(s), 0);
    const pct = Math.round(divide(feitos, totalItens) * 100);
    const abertos = new Set($$("details.bloco[open]", corpo).map(d => d.dataset.id));
    corpo.innerHTML = `
      <div class="cartao"><div class="geral"><strong>Seu portfólio está ${pct}% pronto</strong><div class="progresso"><b style="width:${pct}%"></b></div><strong>${feitos} de ${totalItens}</strong></div></div>
      ${!funciona.marcados ? '<p class="vazio">O que você marcar agora não vai ficar salvo, porque a tabela marcados não está no banco.</p>' : ""}
      ${secoes.map(s => {
        const n = lista(s.itens).length, f = conta(s), p = Math.round(divide(f, n) * 100);
        return `<details class="bloco" data-id="${esc(s.id)}"${abertos.has(String(s.id)) ? " open" : ""}>
          <summary><span style="font-size:20px">${esc(s.emoji || "")}</span><span class="tit"><b>${esc(s.nome)}</b><span>${esc(s.resumo || "")}</span></span><span class="progresso mini"><b style="width:${p}%"></b></span><span class="cont">${f}/${n}</span>${ICONE.abaixo}</summary>
          <div class="bloco-corpo">
            ${s.porque ? `<p class="porque"><b>Por que:</b> ${esc(s.porque)}</p>` : ""}
            ${lista(s.itens).map((it, i) => { const ch = `check:${s.id}:${i}`, ok = dados.marcados.has(ch); return `<label class="item${ok ? " ok" : ""}"><input type="checkbox" data-chave="${esc(ch)}"${ok ? " checked" : ""}><span><b>${esc(it.t)}</b><span>${esc(it.d || "")}</span></span></label>`; }).join("")}
          </div></details>`;
      }).join("")}`;
    $$("input[data-chave]", corpo).forEach(inp => inp.addEventListener("change", async () => { await marca(inp.dataset.chave, inp.checked); desenha(); }));
  };
  desenha();
};

SUB.referencias = function (corpo) {
  const refs = lista(B.REFERENCIAS);
  corpo.innerHTML = `<div class="grade-ref">${refs.map((r, i) => {
    const id = idShort(r.youtube);
    return `<button class="ref" type="button" data-i="${i}" style="background:${CORES_REF[r.cor] || "var(--nude)"}">
      ${id ? `<img src="https://i.ytimg.com/vi/${esc(id)}/oardefault.jpg" alt="" loading="lazy" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${esc(id)}/hqdefault.jpg'">` : ""}
      <span class="emo">${esc(r.emoji || "")}</span>
      <span class="info"><b>${esc(r.titulo)}</b><span>${esc([r.estilo, r.duracao, r.marca].filter(Boolean).join(" · "))}</span></span>
    </button>`;
  }).join("")}</div>`;
  corpo.querySelectorAll(".ref").forEach(b => b.addEventListener("click", () => fichaReferencia(refs[+b.dataset.i])));
};
function fichaReferencia(r) {
  /* os textos da biblioteca já vêm com <b> e <em>, por isso o roteiro entra como está */
  const corpo = `<div class="ficha">
    <p style="font-size:12px;color:var(--suave)">${esc([r.emoji, r.estilo, r.audiencia, r.duracao, r.marca].filter(Boolean).join(" · "))}</p>
    ${r.gancho ? `<h4>O gancho</h4><p class="gancho">${esc(r.gancho)}</p>` : ""}
    ${r.porque ? `<h4>Por que funciona</h4><p>${esc(r.porque)}</p>` : ""}
    ${r.diferencial ? `<h4>O diferencial</h4><p>${esc(r.diferencial)}</p>` : ""}
    ${r.erro ? `<h4>O erro comum</h4><p>${esc(r.erro)}</p>` : ""}
    ${lista(r.roteiro).length ? `<h4>O roteiro</h4><ul class="beats">${lista(r.roteiro).map(b => `<li><span class="t">${esc(b.t)}</span><span>${b.o || ""}</span></li>`).join("")}</ul>` : ""}
  </div>`;
  abreJanela(r.titulo || "Referência", corpo, r.youtube ? `<span class="esp"></span><a class="btn btn--forte" href="${esc(r.youtube)}" target="_blank" rel="noopener">${ICONE.play}Assistir</a>` : "", true);
}

SUB.roteiros = function (corpo) {
  corpo.innerHTML = lista(B.TIPOS).map(t => `<details class="bloco">
    <summary><span style="font-size:20px">${esc(t.emoji || "")}</span><span class="tit"><b>${esc(t.nome)}</b><span>${esc(t.duracao || "")}</span></span>${ICONE.abaixo}</summary>
    <div class="bloco-corpo">
      ${t.porque ? `<p class="porque"><b>Quando usar:</b> ${esc(t.porque)}</p>` : ""}
      <ul class="beats">${lista(t.beats).map(b => `<li><span class="t">${esc(b.t)}</span><span>${b.o || ""}</span></li>`).join("")}</ul>
      ${lista(t.erros).length ? `<p style="margin:12px 0 4px;font-size:12px;color:var(--suave)">Erros comuns</p><ul class="erros">${lista(t.erros).map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
    </div></details>`).join("");
};

SUB.nichos = function (corpo) {
  const comoUsar = lista(B.COMO_USAR);
  corpo.innerHTML = `${comoUsar.length ? `<details class="bloco"><summary><span class="tit"><b>Como usar os ganchos</b></span>${ICONE.abaixo}</summary><div class="bloco-corpo"><ul class="como-usar">${comoUsar.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div></details>` : ""}
    <div class="nichos">${lista(B.NICHOS).map(n => `<div class="nicho"><h3>${esc(n.emoji || "")} ${esc(n.nome)}</h3><ul>${lista(n.ideias).map(i => `<li><b>${esc(i.t)}</b>${i.gancho ? `<q>${esc(i.gancho)}</q>` : ""}</li>`).join("")}</ul></div>`).join("")}</div>`;
};

SUB.revisar = function (corpo) {
  const blocos = lista(B.REVISAO);
  let texto = ""; try { texto = localStorage.getItem("roteiro-em-revisao") || ""; } catch (e) {}
  const chaves = [];
  blocos.forEach((b, bi) => lista(b.itens).forEach((_, i) => chaves.push(`revisao:${bi}:${i}`)));
  const desenha = () => {
    const feitos = chaves.filter(c => dados.marcados.has(c)).length;
    const pct = Math.round(divide(feitos, chaves.length) * 100);
    corpo.innerHTML = `
      <div class="cartao"><h3>Cole aqui o seu roteiro</h3><textarea class="roteiro" id="rev-texto" placeholder="Cole o roteiro e confira item por item embaixo.">${esc(texto)}</textarea></div>
      <div class="cartao"><div class="geral"><strong>Revisão ${pct}% feita</strong><div class="progresso"><b style="width:${pct}%"></b></div><button class="btn" type="button" id="rev-limpa">Começar outra revisão</button></div></div>
      ${blocos.map((b, bi) => `<div class="cartao"><h3 style="color:var(--texto);font-size:14px">${esc(b.emoji || "")} ${esc(b.bloco)}</h3>
        ${lista(b.itens).map((it, i) => { const ch = `revisao:${bi}:${i}`, ok = dados.marcados.has(ch); return `<label class="item${ok ? " ok" : ""}"><input type="checkbox" data-chave="${ch}"${ok ? " checked" : ""}><span><b>${esc(it.t)}</b><span>${esc(it.d || "")}</span></span></label>`; }).join("")}
      </div>`).join("")}`;
    $("#rev-texto").addEventListener("input", (e) => { texto = e.target.value; try { localStorage.setItem("roteiro-em-revisao", texto); } catch (x) {} });
    $$("input[data-chave]", corpo).forEach(inp => inp.addEventListener("change", async () => { await marca(inp.dataset.chave, inp.checked); desenha(); }));
    $("#rev-limpa").addEventListener("click", async () => {
      if (!confirm("Limpar o roteiro e desmarcar todos os itens da revisão?")) return;
      texto = ""; try { localStorage.removeItem("roteiro-em-revisao"); } catch (x) {}
      const marcadas = chaves.filter(c => dados.marcados.has(c));
      marcadas.forEach(c => dados.marcados.delete(c));
      if (funciona.marcados && marcadas.length) await sb.from("marcados").delete().like("chave", "revisao:%");
      desenha();
    });
  };
  desenha();
};
</script>
