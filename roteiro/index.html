<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Roteiro · Cris Dall' Accua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Página de roteiro para aprovação · identidade do site crisdallaccua.com
   Linho, café e caramelo · Tenor Sans nos títulos, Jost nos textos
   Cartões retos com sombra suave · uma ação por cena: comentar
   No fim, a marca aprova ou pede ajuste, e a resposta aparece no painel da Cris */
:root{--linho:#EFE9E1;--cafe:#3B322B;--apoio:#5F5044;--caramelo:#A9825F;--bloco:#D8C3AC;--linha:#D9CFC3;--card:#FFFFFF;
--titulo:"Tenor Sans",Georgia,serif;--texto:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box;min-width:0}html,body{margin:0}
body{background:var(--linho);color:var(--cafe);font:16px/1.6 var(--texto);-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3{font-family:var(--titulo);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}em{font-style:italic;color:var(--caramelo)}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 72px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 0}
.assina{font-family:var(--titulo);font-size:1.1rem}
.rot{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--apoio);font-weight:500}
.hero{background:var(--cafe);color:var(--linho);padding:clamp(28px,5vw,48px);display:grid;gap:18px;box-shadow:0 12px 30px rgba(59,50,43,.18)}
.hero .rot{color:var(--bloco)}
.hero.com-foto{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:center;column-gap:clamp(20px,4vw,40px)}
.hero-txt{display:grid;gap:18px}
.foto-prod{margin:0;background:#fff;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.foto-prod img{width:100%;height:100%;object-fit:contain;display:block}
@media(max-width:640px){.hero.com-foto{grid-template-columns:1fr}.foto-prod{max-width:320px;width:100%;justify-self:center;order:-1}}
.clima{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.clima figure{margin:0;overflow:hidden;min-height:260px;background:var(--linho)}
.clima figure img{width:100%;height:100%;object-fit:cover;display:block}
.clima figcaption{font-size:.8rem;color:var(--apoio);padding:8px 2px 0}
.tons{display:grid;gap:12px;align-content:start}
.tom{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;border:1px solid var(--linha);padding:12px}
.tom i{width:44px;height:44px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.tom b{font-weight:500;display:block}.tom span{font-size:.9rem;color:var(--apoio)}
@media(max-width:640px){.clima{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.1rem,6vw,3.2rem)}
.hero h1 em{color:var(--bloco)}
.hero .obj{font-size:1.05rem;max-width:60ch;color:#E6DCD0}
.dados{display:flex;flex-wrap:wrap;gap:12px 32px;border-top:1px solid #5F5044;padding-top:16px}
.dados div{display:grid;gap:2px}.dados b{font-weight:500}
.aviso{margin:20px 0;padding:14px 18px;border-left:3px solid var(--caramelo);background:#F7F2EC;font-size:.95rem}
.card{background:var(--card);box-shadow:0 6px 22px rgba(59,50,43,.08);padding:clamp(22px,4vw,34px);margin-top:20px;display:grid;gap:18px}
.gancho{font-family:var(--titulo);font-size:clamp(1.5rem,4vw,2rem);line-height:1.25}
.barra{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap}
.barra h2,.card h2{font-size:clamp(1.6rem,4vw,2.1rem)}
.btn{font:500 .95rem var(--texto);min-height:44px;padding:10px 20px;border:1.5px solid var(--cafe);background:transparent;color:var(--cafe);cursor:pointer}
.btn:hover{background:#F7F2EC}.btn:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--caramelo);outline-offset:2px}
.btn.cheio{background:var(--cafe);color:var(--linho)}.btn.cheio:hover{background:#2C251F}
.btn:disabled{opacity:.5;cursor:wait}
.cenas{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.cena{border:1px solid var(--linha);padding:20px;display:grid;gap:12px;background:var(--card)}
.cena.tem{border-color:var(--caramelo)}
.cab{display:flex;align-items:baseline;gap:14px}
.num{font-family:var(--titulo);font-size:1.9rem;color:var(--caramelo);line-height:1}
.tempo{margin-left:auto;font-size:.82rem;color:var(--apoio);white-space:nowrap;font-variant-numeric:tabular-nums}
.fala{font-family:var(--titulo);font-size:1.2rem;line-height:1.45;border-left:3px solid var(--caramelo);padding-left:14px}
.parte{display:grid;gap:3px}
.tela div span{display:inline-block;background:var(--cafe);color:var(--linho);padding:3px 10px;font-size:.88rem;margin:2px 6px 2px 0}
body.so-falas .parte,body.so-falas .comentar,body.so-falas .caixa{display:none}
.comentar{justify-self:start;font:500 .92rem var(--texto);color:var(--cafe);background:none;border:0;border-bottom:1.5px solid var(--caramelo);padding:6px 0;min-height:44px;cursor:pointer}
.caixa{display:none}.caixa.aberta{display:block}
textarea,input{width:100%;font:16px/1.5 var(--texto);color:var(--cafe);border:1px solid var(--linha);background:#FBF8F4;padding:12px 14px}
textarea{min-height:90px;resize:vertical}
.lista{margin:0;padding-left:1.1em;display:grid;gap:6px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:640px){.duas{grid-template-columns:1fr}}
.resp{background:var(--bloco)}
.resp label{display:grid;gap:6px;font-weight:500}
.resumo{font-size:.95rem;color:var(--apoio)}
.acoes{display:flex;gap:12px;flex-wrap:wrap}
.status{font-weight:500}
.feito{text-align:center;padding:40px 20px}
.feito h2{font-size:2rem;margin-bottom:10px}
footer{text-align:center;font-size:.85rem;color:var(--apoio);padding-top:36px}
.erro{padding:60px 20px;text-align:center}
@media(prefers-reduced-motion:no-preference){.caixa.aberta{animation:abre .2s ease-out}@keyframes abre{from{opacity:0;transform:translateY(-4px)}}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topo"><span class="assina">Cris Dall' Accua</span><span class="rot">Roteiro para aprovação</span></div>
  <main id="app"><p class="erro">Carregando o roteiro…</p></main>
  <footer>Cris Dall' Accua · UGC e Influencer · Porto Alegre, RS · <a href="https://crisdallaccua.com" style="color:inherit">crisdallaccua.com</a></footer>
</div>
<script src="../js/banco.js"></script>
<script>
{
// As respostas vão para a tabela roteiro_respostas do banco do painel (Supabase).
const B = window.BANCO || null;

const app = document.getElementById('app');
const id = (new URLSearchParams(location.search).get('id') || '').replace(/[^a-z0-9-]/gi, '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chave = 'roteiro-rascunho-' + id;
const guardar = v => { try { localStorage.setItem(chave, JSON.stringify(v)); } catch (e) {} };
const lerRascunho = () => { try { return JSON.parse(localStorage.getItem(chave) || '{}'); } catch (e) { return {}; } };

function render(r) {
  document.title = 'Roteiro ' + r.marca + ' · Cris Dall\' Accua';
  const rasc = lerRascunho();
  const coments = rasc.cenas || {};
  app.innerHTML = `
  <header class="hero${r.imagem ? ' com-foto' : ''}">
    <div class="hero-txt">
    <p class="rot">${esc(r.marca)} · ${esc(r.campanha)}</p>
    <h1>${esc(r.marca)} <em>&amp;</em> Cris · ${esc(r.titulo)}</h1>
    <p class="obj">${esc(r.objetivo)}</p>
    <div class="dados">
      <div><span class="rot">Formato</span><b>${esc(r.formato)}</b></div>
      <div><span class="rot">Creator</span><b>${esc(r.creator)}</b></div>
    </div>
    </div>
    ${r.imagem ? `<figure class="foto-prod"><img src="${esc(r.imagem.src)}" alt="${esc(r.imagem.alt || r.campanha)}" onerror="this.closest('figure').remove()"></figure>` : ''}
  </header>
  <p class="aviso">Leia com calma. Para mudar alguma coisa, toque em <b>Comentar esta cena</b>. No final, é só aprovar ou pedir os ajustes.</p>
  <section class="card"><span class="rot">O gancho</span><p class="gancho">“${esc(r.gancho)}”</p></section>
  ${r.clima ? `<section class="card"><div><span class="rot">Mood board</span><h2>O clima do <em>vídeo</em></h2></div>
    ${r.clima.texto ? `<p>${esc(r.clima.texto)}</p>` : ''}
    <div class="clima">
      ${r.clima.imagem ? `<figure><img src="${esc(r.clima.imagem.src)}" alt="${esc(r.clima.imagem.alt || '')}" loading="lazy" onerror="this.closest('figure').remove()">${r.clima.imagem.legenda ? `<figcaption>${esc(r.clima.imagem.legenda)}</figcaption>` : ''}</figure>` : ''}
      <div class="tons">${(r.clima.itens || []).map(t => `<div class="tom"><i style="background:${/^#[0-9a-f]{3,8}$/i.test(t.cor || '') ? t.cor : 'var(--bloco)'}"></i><div><b>${esc(t.nome)}</b><span>${esc(t.texto || '')}</span></div></div>`).join('')}</div>
    </div></section>` : ''}
  <section class="card">
    <div class="barra"><div><span class="rot">Roteiro</span><h2>Cena a <em>cena</em></h2></div>
      <button class="btn" id="falas" type="button" aria-pressed="false">Ler só as falas</button></div>
    <ol class="cenas">${r.cenas.map((c, i) => `
      <li class="cena${coments[i+1] ? ' tem' : ''}" id="cena-${i+1}">
        <div class="cab"><span class="num">${String(i+1).padStart(2,'0')}</span>${c.tempo ? `<span class="tempo">${esc(c.tempo)}</span>` : ''}</div>
        <p class="fala">“${esc(c.fala)}”</p>
        <div class="parte"><span class="rot">O que aparece</span><p>${esc(c.visual)}</p></div>
        ${c.tela ? `<div class="parte tela"><span class="rot">Texto na tela</span><div><span>${esc(c.tela)}</span></div></div>` : ''}
        <button class="comentar" type="button" data-n="${i+1}" aria-expanded="${coments[i+1] ? 'true' : 'false'}">${coments[i+1] ? 'Editar comentário' : 'Comentar esta cena'}</button>
        <div class="caixa${coments[i+1] ? ' aberta' : ''}"><textarea data-n="${i+1}" aria-label="Comentário sobre a cena ${i+1}" placeholder="O que você gostaria de mudar nesta cena?">${esc(coments[i+1] || '')}</textarea></div>
      </li>`).join('')}
    </ol>
  </section>
  <section class="card">
    <span class="rot">Detalhes</span><h2>Gravação e <em>cuidados</em></h2>
    <div class="duas">
      <div><h3 style="margin-bottom:10px">O que não pode faltar</h3><ul class="lista">${(r.naoPodeFaltar||[]).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
      <div><h3 style="margin-bottom:10px">Como vai ser gravado</h3><ul class="lista">${(r.gravacao||[]).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    </div>
  </section>
  <section class="card resp" id="resposta">
    <span class="rot">Sua resposta</span><h2>Aprovar ou <em>ajustar</em></h2>
    <p class="resumo" id="resumo"></p>
    <label>Algum comentário geral sobre o roteiro? (opcional)<textarea id="geral">${esc(rasc.geral || '')}</textarea></label>
    <label>Seu nome (opcional)<input id="nome" autocomplete="name" value="${esc(rasc.nome || '')}"></label>
    <div class="acoes">
      <button class="btn" id="ajuste" type="button">Solicitar ajuste</button>
      <button class="btn cheio" id="aprovar" type="button">Aprovar roteiro</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>`;

  const estado = () => {
    const cenas = {};
    app.querySelectorAll('.cena textarea').forEach(t => { if (t.value.trim()) cenas[t.dataset.n] = t.value.trim(); });
    return { cenas, geral: document.getElementById('geral').value, nome: document.getElementById('nome').value };
  };
  const atualizar = () => {
    const s = estado(); guardar(s);
    const n = Object.keys(s.cenas);
    app.querySelectorAll('.cena').forEach((li, i) => li.classList.toggle('tem', !!s.cenas[i+1]));
    document.getElementById('resumo').textContent = n.length
      ? 'Você comentou ' + (n.length === 1 ? 'a cena ' : 'as cenas ') + n.join(', ') + '.'
      : 'Nenhuma cena comentada até agora.';
  };
  app.addEventListener('input', atualizar);
  atualizar();

  app.querySelectorAll('.comentar').forEach(b => b.addEventListener('click', () => {
    const caixa = b.nextElementSibling; const abre = !caixa.classList.contains('aberta');
    caixa.classList.toggle('aberta', abre); b.setAttribute('aria-expanded', abre);
    if (abre) caixa.querySelector('textarea').focus();
  }));
  const bf = document.getElementById('falas');
  bf.addEventListener('click', () => {
    const on = document.body.classList.toggle('so-falas');
    bf.setAttribute('aria-pressed', on); bf.textContent = on ? 'Ver roteiro completo' : 'Ler só as falas';
  });

  const enviar = async decisao => {
    const s = estado(); const st = document.getElementById('status');
    if (decisao === 'ajuste' && !Object.keys(s.cenas).length && !s.geral.trim()) {
      st.textContent = 'Conte o que você quer ajustar: comente uma cena ou escreva no comentário geral.'; return;
    }
    if (!B) { st.textContent = 'O envio não está disponível agora. Responda pela mensagem em que você recebeu este link.'; return; }
    app.querySelectorAll('.acoes .btn').forEach(b => b.disabled = true);
    st.textContent = 'Enviando…';
    try {
      const corpo = { roteiro: id, marca: r.marca, titulo: r.campanha + ' · ' + r.titulo, decisao,
        nome: s.nome.trim() || null, geral: s.geral.trim() || null,
        cenas: Object.entries(s.cenas).map(([cena, comentario]) => ({ cena: Number(cena), comentario })) };
      const resp = await fetch(B.url + '/rest/v1/roteiro_respostas', { method: 'POST',
        headers: { apikey: B.chave, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify(corpo) });
      if (!resp.ok) throw new Error('falha ' + resp.status);
      try { localStorage.removeItem(chave); } catch (e) {}
      app.innerHTML = `<section class="card feito"><span class="rot">Resposta enviada</span>
        <h2>${decisao === 'aprovado' ? 'Roteiro <em>aprovado</em>. Obrigada!' : 'Recebi os <em>ajustes</em>. Obrigada!'}</h2>
        <p>${decisao === 'aprovado' ? 'Agora eu sigo para a gravação e envio o vídeo para validação antes de publicar.' : 'Vou ajustar o roteiro e te mando a nova versão neste mesmo link.'}</p></section>`;
      scrollTo(0, 0);
    } catch (e) {
      app.querySelectorAll('.acoes .btn').forEach(b => b.disabled = false);
      st.textContent = 'Não consegui enviar agora. Tente de novo em instantes ou responda pela mensagem em que você recebeu este link.';
    }
  };
  document.getElementById('ajuste').addEventListener('click', () => enviar('ajuste'));
  document.getElementById('aprovar').addEventListener('click', () => enviar('aprovado'));
}

if (!id) {
  app.innerHTML = '<p class="erro">Este link de roteiro está incompleto. Confira o endereço que você recebeu.</p>';
} else {
  fetch('r/' + id + '.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(render)
    .catch(() => { app.innerHTML = '<p class="erro">Não encontrei este roteiro. Confira o link que você recebeu.</p>'; });
}
}
</script>
</body>
</html>
